[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "condo_suite"
version = "0.1.0"
description = "Condominium management suite"
requires-python = ">=3.8"
dependencies = [
    "gevent",
    "gunicorn",
    "pymongo",
    "mongoengine",
    "python-dateutil",
    "httplib2",
    "urllib3",
    "oauth2client",
    "google-api-python-client",
    "PyYAML",
    "pycountry",
    "pytz",
    "pyasn1",
    "pyasn1-modules",
    "lxml",
    "Jinja2",
    "Cython",
    "qrcode",
]

[project.scripts]
condo-suite-rbac = "condo_suite.util.deploy.rbac:deploy"

[tool.setuptools]
package-dir = {condo_suite = "src"}
include-package-data = true

packages = [
    "condo_suite",
    "condo_suite.config",
    "condo_suite.handlers",
    "condo_suite.handlers.defer",
    "condo_suite.handlers.defer.mail",
    "condo_suite.handlers.ext",
    "condo_suite.handlers.mail",
    "condo_suite.handlers.web",
    "condo_suite.handlers.web.auth_ext",
    "condo_suite.handlers.web.decorator",
    "condo_suite.handlers.web.transaction",
    "condo_suite.modules",
    "condo_suite.modules.mongo",
    "condo_suite.modules.rbac",
    "condo_suite.modules.session",
    "condo_suite.modules.templates",
    "condo_suite.util",
    "condo_suite.util.deploy",
    "condo_suite.util.mail",
    "condo_suite.util.web",
]

[tool.setuptools.package-data]
condo_suite = ["templates/**/*.tmpl", "resource/**/*"]
